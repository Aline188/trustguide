version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustguide-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trustguide
      POSTGRES_PASSWORD: trustguide_pass
      POSTGRES_DB: trustguide
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trustguide-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
